[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stew-data-steward"
version = "0.2.0"
description = "Sovereign AI Data Steward for Helmholtz: FAIR² & MLCommons Croissant Research Data Management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Helmholtz Open Science Community" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "openai>=1.40.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "h5py>=3.11.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
stew = "run:main"

[tool.setuptools.packages.find]
include = ["clara*"]
