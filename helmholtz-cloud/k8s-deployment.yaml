apiVersion: apps/v1
kind: Deployment
metadata:
  name: stew
  labels:
    app: stew
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stew
  template:
    metadata:
      labels:
        app: stew
    spec:
      containers:
        - name: stew
          image: stew-data-steward:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: BLABLADOR_BASE_URL
              value: "https://api.helmholtz-blablador.fz-juelich.de/v1"
            - name: BLABLADOR_MODEL
              value: "alias-fast"
            # In production, inject BLABLADOR_API_KEY from a Kubernetes Secret
            - name: BLABLADOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stew-secrets
                  key: blablador-api-key
                  optional: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stew-service
spec:
  selector:
    app: stew
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
# OpenShift Route for Helmholtz Cloud (OKD / OpenShift Clusters)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stew-route
spec:
  to:
    kind: Service
    name: stew-service
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
